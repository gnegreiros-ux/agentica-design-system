name: Chromatic — Visual regression

# Component visual regression tests (ADR-006).
# The token lives in the CHROMATIC_PROJECT_TOKEN GitHub secret — never in plaintext in the repo.

on:
  # Scope intentionally narrow: the free Chromatic account has already
  # hit its snapshot limit (disabled on 2026-07-02, over quota again in
  # 2026-09). Chromatic is therefore not a continuous check on this project,
  # but a point-in-time tool — triggered only when a visual change is
  # plausible.
  #
  # Paths = only what builds Storybook (components, its config, the tokens
  # it renders with, dependencies). site/build.js, guidelines/, decisions/
  # and scripts/ used to be listed too: they never reach Storybook, yet
  # site/build.js alone (the site changelog) triggered a full ~208-snapshot
  # build on almost every PR.
  #
  # `push` on every branch except main, not `pull_request`: TurboSnap
  # (onlyChanged below) is not compatible with the pull_request trigger —
  # it runs on an ephemeral merge commit that isn't in git history, so
  # changed-file detection is unreliable (chromatic.com/docs/turbosnap/setup).
  # main stays excluded so merges don't re-consume the quota.
  push:
    branches-ignore: [main]
    paths:
      - 'components/**'
      - '.storybook/**'
      - 'tokens/**'
      - 'style-dictionary/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Chromatic compares against the baseline — full git history required

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci): the root lockfile carries cross-platform coverage,
        # but a transitive edge (@emnapi/core) with an unresolved node fails npm ci's
        # strict mode. npm install reconciles and installs the native Linux binaries
        # required by the Storybook build.
        run: npm install --no-audit --no-fund

      - name: Build tokens (Style Dictionary)
        # Generates dist/tokens/css/all.css with the --agtc-component-* vars required by the Web Components.
        # Without this step, Storybook components render unstyled (unresolved tokens).
        run: npm run tokens

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true # a visual diff doesn't block CI — a human approves in Chromatic
          # TurboSnap: only snapshot stories whose dependency graph changed;
          # the rest are copied (billed at 1/5) or bypassed. Needs the full git
          # history above; the CLI adds --stats-json to build-storybook itself.
          onlyChanged: true
