name: Full audit — smoke, contracts, site-wide accessibility

# Runs the three checks `npm test` chains that have no other CI coverage:
# `smoke` (scripts/smoke-test.js), `validate:contracts` (scripts/validate-contracts.js),
# and `axe:all` (scripts/axe-audit.js). Deliberately NOT `npm test` itself — that
# chain also includes `lang-audit` and `tokens-audit --ci`, which already run as
# their own required checks (lang-audit.yml, tokens-audit.yml); running them again
# here would waste CI time and report the same violation under two job names.
#
# Found via the #127 inventory (2026-09-19): none of these three had ever run in
# any CI workflow — `npm test` itself is called by no workflow at all. axe-audit.js
# in particular scans every page in site/dist/ (149 pages, 3 contexts each), while
# the existing Playwright accessibility.spec.js only covers 10. The inventory found
# 139 of those 149 pages had never been checked for accessibility by anything.
#
# Blocking since 2026-10-23 (#243): 15 runs observed since 2026-09-18 surfaced
# exactly one real violation (run 38475014319, 2026-10-13 — [serious]
# color-contrast on index.html, fixed in the next push), masked behind a green
# job by `continue-on-error`. The exit condition this comment used to describe
# (a human triaging at least one full run's output) is met — see #243/#244/#245.

on:
  push:
    branches: [main]
  # PR-only for both targets, not on every push to develop — a full build +
  # 157-page audit on every commit would be too costly for that branch's pace.
  #
  # `main` MUST be included here (#248): `full-audit` is a required status
  # check on `main` (added alongside #243), and a required check with no
  # trigger matching the pull_request event never reports — GitHub then
  # blocks every PR into main waiting on a check that can never run.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci): aligned with the other workflows — cross-platform lockfile
        run: npm install --no-audit --no-fund

      - name: Build tokens
        run: npm run tokens

      - name: Build site
        run: node site/build.js

      - name: Install Playwright Chromium
        # smoke-test.js and axe-audit.js use the raw `playwright` package
        # directly, not @playwright/test — same browser install either way.
        run: npx playwright install --with-deps chromium

      - name: Smoke test (component token resolution)
        run: npm run smoke

      - name: Validate contracts (governance layer)
        run: npm run validate:contracts

      - name: Accessibility audit — every generated page
        run: npm run axe:all

      - name: Alert on failure
        if: failure()
        run: |
          echo "## ❌ Full audit failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One of smoke / validate:contracts / axe:all failed." >> "$GITHUB_STEP_SUMMARY"
          echo "See the job log above for which step and why." >> "$GITHUB_STEP_SUMMARY"
